<!DOCTYPE html>

<style>

  .cr7 { padding:6rem 2rem; max-width:1000px; margin:0 auto; }
  .cr7 h2 { text-align:center; font-family:'Bebas Neue',sans-serif; font-size:50px; margin-bottom:1rem; color:var(--oro); }
  .video-wrap { position:relative; padding-bottom:56.25%; height:0; border-radius:16px; overflow:hidden; border:1px solid rgba(0,245,255,0.3); box-shadow:var(--glow-oro); }
